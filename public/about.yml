# Band Information
bandName: "partiprivati"
tagline: ""
description:
  "Partiprivati ist eine junge Indiepop-Band aus Freiburg. Mal nachdenklich und ernst, mal ironisch und
  aufgedreht verarbeiten sie in ihren Liedern persönliche und gesellschaftliche Themen. Ihr
  abwechslungsreicher Sound entsteht durch die besondere Besetzung: Gesang, Cello, Klavier und
  Synths verschmelzen zu detailreichen Arrangements – beeinflusst von Klassik, Jazz und Pop.
  Mit ihrer Musik schafft Partiprivati Räume für Nähe – zu sich selbst, zu den eigenen Gefühlen und
  Gedanken, und zu den Menschen um einen herum."

